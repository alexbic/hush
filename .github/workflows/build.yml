name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install py2app
        
    - name: Build app
      run: |
        python build_app.sh
        
    - name: Create DMG
      run: |
        hdiutil create -volname "HUSH v1.2" -srcfolder "dist/HUSH.app" -ov -format UDZO "HUSH-v1.2.dmg"
        
    - name: Upload DMG to release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: HUSH ${{ github.ref_name }}
        body: |
          ## HUSH ${{ github.ref_name }}
          
          ### Changes
          - Models are now downloaded on first run instead of being bundled
          - Reduced application size from 500MB+ to ~50MB
          - Improved CI/CD pipeline for automated builds
          
          ### Installation
          1. Download the DMG file
          2. Open it and drag HUSH to your Applications folder
          3. On first launch, models will be automatically downloaded
          
          ### Note
          First launch may take longer as models are downloaded from Google Drive.
        files: HUSH-v1.2.dmg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}