name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*' # Срабатывает при пуше тегов, начинающихся на 'v' (например, v1.0.0, v1.2)
  workflow_dispatch:
    inputs:
      test_build:
        description: 'Test build without release'
        required: false
        type: boolean
        default: false

jobs:
  build-macos:
    # КЛЮЧЕВОЙ МОМЕНТ: Используем macOS runner
    runs-on: macos-latest
    timeout-minutes: 10
    
    steps:
      # 1. Получаем исходный код репозитория
      - name: Checkout code
        uses: actions/checkout@v5
        
      # 2. Настраиваем Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          
      # 3. Установка зависимостей
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install numpy sounddevice pynput markdown html2text anthropic
          
      # 4. Сборка приложения
      - name: Build HUSH App
        run: |
          # Make build script executable
          chmod +x build_app.sh
          
          # Build the app
          ./build_app.sh
          
          # Verify the app was created
          test -d HUSH.app && test -f HUSH.app/Contents/MacOS/HUSH
          
      # 5. Создание архива
      - name: Create archive
        run: |
          # Create zip archive
          ditto -c -k --keep-parent HUSH.app HUSH-macos.zip
          
      # 6. Загрузка артефактов
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: HUSH-macos
          path: HUSH-macos.zip
          retention-days: 30

  release:
    needs: build-macos
    runs-on: macos-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.inputs.test_build != 'true'
    
    steps:
      # 1. Скачиваем артефакт
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: HUSH-macos
          
      # 2. Создаем релиз
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## HUSH v${{ github.ref_name }}
            
            ### Features
            - Multi-monitor support with automatic window relocation
            - PortAudio hang recovery mechanism
            - Enhanced error handling and diagnostics
            - Improved UI for all modes (silent, main, expanded)
            
            ### Installation
            1. Download HUSH-macos.zip
            2. Extract and move HUSH.app to Applications folder
            3. Run from Applications
            
            ### Requirements
            - macOS (latest)
            - Python 3.14 (from Homebrew)
            - Microphone and Accessibility permissions
            
            ### Usage
            - Right Option: Start/stop silent recording
            - Shift + Right Option: Open/close full mode
            - Enter: Paste accumulated text
            
            ### Testing
            - Intensive PortAudio stress testing completed
            - Multi-monitor functionality verified
            - All existing functionality preserved
            
            ### Changelog
            - Automatic window relocation to target app screen
            - Screen configuration change handling
            - PortAudio recovery with timeout mechanism
            - Enhanced action buttons visibility
            - Improved error logging and diagnostics
            
            **Built on:** ${{ github.event.created_at }}
            
          files: HUSH-macos.zip
          draft: false
          prerelease: false
          generate_release_notes: true