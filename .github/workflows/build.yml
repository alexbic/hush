name: Build HUSH

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
        
    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install numpy sounddevice pynput markdown html2text anthropic
        
    - name: Build HUSH App
      run: |
        # Make build script executable
        chmod +x build_app.sh
        
        # Build the app using the proper script
        ./build_app.sh
        
        # Verify the app was created
        test -d HUSH.app && test -f HUSH.app/Contents/MacOS/HUSH
        
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: HUSH-app-macos
        path: HUSH.app/
        retention-days: 30