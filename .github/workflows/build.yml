name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install py2app requests
    
    - name: Build app
      run: |
        chmod +x build_app.sh
        ./build_app.sh
    
    - name: Build DMG
      run: |
        pip install dmgbuild
        python -c "
        import dmgbuild
        version = '${{ github.ref_name }}'
        dmgbuild.build_dmg(
            f'HUSH v{version}',
            f'HUSH-{version}.dmg',
            settings={
                'files': ['HUSH.app'],
                'title': f'HUSH v{version}',
                'icon': 'HUSH.app/Contents/Resources/hush.icns',
            }
        )
        "
    
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: HUSH-${{ github.ref_name }}.dmg
        path: HUSH-${{ github.ref_name }}.dmg

  release:
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download DMG
      uses: actions/download-artifact@v4
      with:
        name: HUSH-${{ github.ref_name }}.dmg
        path: .
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: HUSH-${{ github.ref_name }}.dmg
        name: HUSH v${{ github.ref_name }}
        body: |
          HUSH v${{ github.ref_name }}
          
          ## What's Changed
          - Models are now downloaded from GitHub releases on first run
          - Reduced application bundle size by removing bundled models
          - Improved fallback mechanism for model loading
          
          ## Installation
          1. Download the DMG file
          2. Open it and drag HUSH to your Applications folder
          3. Run HUSH from Applications
          
          ## First Run
          On first run, HUSH will automatically download the required models (~450MB) from GitHub releases.
          
          ## Requirements
          - macOS 12.0 or later
          - Apple Silicon or Intel Mac
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}