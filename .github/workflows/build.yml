name: Build and Release HUSH

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      test_build:
        description: 'Test build without release'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.14'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
        
    - name: Verify Python
      run: |
        python3 --version
        which python3
        
    - name: Build HUSH App
      run: |
        # Make build script executable
        chmod +x build_app.sh
        
        # Build the app
        ./build_app.sh || exit 1
        
        # Verify the app was created
        ls -la HUSH.app || exit 1
        
    - name: Test app compilation
      run: |
        # Test Python compilation
        python3 -m compileall -q src
        
        # Verify Info.plist
        plutil -lint HUSH.app/Contents/Info.plist
        
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: HUSH-app-macos
        path: HUSH.app/
        retention-days: 30

  release:
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.inputs.test_build != 'true'
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v5
      with:
        name: HUSH-app-macos
        
    - name: Create release archive
      run: |
        # Get tag name
        TAG_NAME=${{ github.ref_name }}
        
        # Create zip archive
        ditto -c -k --keep-parent HUSH.app HUSH-v${TAG_NAME}-macos.zip
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## HUSH v${{ github.ref_name }}
          
          ### Features
          - Multi-monitor support with automatic window relocation
          - PortAudio hang recovery mechanism
          - Enhanced error handling and diagnostics
          - Improved UI for all modes (silent, main, expanded)
          
          ### Installation
          1. Download HUSH-v${{ github.ref_name }}-macos.zip
          2. Extract and move HUSH.app to Applications folder
          3. Run from Applications
          
          ### Requirements
          - macOS (latest)
          - Python 3.14 (from Homebrew)
          - Microphone and Accessibility permissions
          
          ### Usage
          - Right Option: Start/stop silent recording
          - Shift + Right Option: Open/close full mode
          - Enter: Paste accumulated text
          
          ### Testing
          - Intensive PortAudio stress testing completed
          - Multi-monitor functionality verified
          - All existing functionality preserved
          
          ### Changelog
          - Automatic window relocation to target app screen
          - Screen configuration change handling
          - PortAudio recovery with timeout mechanism
          - Enhanced action buttons visibility
          - Improved error logging and diagnostics
          
          **Built on:** ${{ github.event.created_at }}
          
        files: HUSH-v${{ github.ref_name }}-macos.zip
        draft: false
        prerelease: false
        generate_release_notes: true

  # Generate release notes for PRs and regular pushes
  generate-pr-notes:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.sha, github.event.before)
    
    steps:
    - name: Generate PR notes
      uses: actions/github-script@v7
      with:
        script: |
          const { context } = require('@actions/github');
          
          // Get commits since last push
          const commits = await github.rest.repos.compareCommits({
            owner: context.repo.owner,
            repo: context.repo.repo,
            base: context.payload.before,
            head: context.payload.sha
          });
          
          // Generate changelog
          let changelog = '## Recent Changes\n\n';
          commits.data.commits.forEach(commit => {
            const shortSha = commit.sha.substring(0, 7);
            changelog += `- ${commit.commit.message} (${shortSha})\n`;
          });
          
          // Create PR or update existing one
          const prs = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            head: `${context.repo.owner}:${context.ref}`
          });
          
          if (prs.data.length > 0) {
            // Update first PR
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prs.data[0].number,
              body: `${prs.data[0].body}\n\n${changelog}`
            });
          }
          
          console.log('Changelog generated:', changelog);