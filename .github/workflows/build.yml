name: Build HUSH

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Build HUSH App
      run: |
        # Make build script executable
        chmod +x build_app.sh
        
        # Build the app
        ./build_app.sh
        
        # Verify the app was created
        test -d HUSH.app && test -f HUSH.app/Contents/MacOS/HUSH
        
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: HUSH-app
        path: HUSH.app/
        retention-days: 30