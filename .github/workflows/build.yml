name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      test_build:
        description: 'Test build without release'
        required: false
        type: boolean
        default: false

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install numpy sounddevice pynput markdown html2text anthropic requests

      - name: Build HUSH App
        run: |
          chmod +x build_app.sh
          ./build_app.sh
          test -d HUSH.app && test -f HUSH.app/Contents/MacOS/HUSH

      - name: Create DMG
        run: |
          hdiutil create -volname "HUSH" -srcfolder "HUSH.app" -ov -format UDZO "hush.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: hush-dmg
          path: hush.dmg
          retention-days: 30

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.inputs.test_build != 'true'
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: hush-dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## HUSH ${{ github.ref_name }}

            ### Installation
            1. Download hush.dmg
            2. Open it and drag HUSH to your Applications folder
            3. On first launch, models will be automatically downloaded
          files: hush.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
